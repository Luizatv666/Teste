<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carteira de Investimentos</title>
    <meta name="description" content="Painel para acompanhar movimentações de ativos" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="header">
        <div>
          <p class="eyebrow">Acompanhamento</p>
          <h1>Movimentações da carteira</h1>
        </div>
        <p class="status" id="lastUpdated">Aguardando dados...</p>
      </header>

      <section class="version-panel" aria-label="Versões dos arquivos">
        <h2>Versões locais</h2>
        <div class="version-list" id="versionList"></div>
      </section>

      <section class="summary">
        <article class="card">
          <span>Total investido</span>
          <strong id="totalInvestido">R$ 0,00</strong>
        </article>
        <article class="card">
          <span>Movimentações</span>
          <strong id="quantidadeAtivos">0</strong>
        </article>
        <article class="card">
          <span>Ativos distintos</span>
          <strong id="ativosUnicos">0</strong>
        </article>
      </section>

      <section class="toolbar">
        <button class="view-btn active" data-view="movements">Mostrar movimentações</button>
        <button class="view-btn" data-view="summary">Mostrar resumo por ativo</button>
      </section>

      <section class="table-card" id="tableContainer">
        <table id="movementsTable">
          <thead>
            <tr>
              <th>Ativo</th>
              <th>Movimentação</th>
              <th>Data</th>
              <th>Quantidade</th>
              <th>Valor total</th>
            </tr>
          </thead>
          <tbody id="movementsBody">
            <tr>
              <td colspan="5">Carregando...</td>
            </tr>
          </tbody>
        </table>

        <div id="summaryGroups" class="summary-groups" hidden></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
